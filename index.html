<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disponibilitat · Lliga Femenina Sitges</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f6f7;margin:0;color:#17202a}
.wrap{max-width:900px;margin:auto;padding:22px}
.card{background:white;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 2px 12px #00000010}
h1{margin:0 0 5px} h2{margin-top:0}
select,button,input{font-size:16px;padding:11px;border-radius:10px;border:1px solid #ccd2d8}
button{cursor:pointer;background:#17202a;color:white;border:0}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
.day{border:1px solid #e0e4e8;border-radius:12px;padding:12px}
.opts{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
label{border:1px solid #d6dbe0;border-radius:9px;padding:8px 10px;cursor:pointer}
label:has(input:checked){background:#e7f5ec;border-color:#54a66b}
input{accent-color:#2d8a4a}
.small{color:#68727d;font-size:14px}
.match{padding:13px;border:1px solid #e1e5e8;border-radius:12px;margin:8px 0}
.ok{color:#287a3d}.none{color:#b13b3b}
.hidden{display:none}
</style>

<style id="logo-lliga-style">
.brand-header{
  max-width:900px;
  margin:18px auto 6px;
  padding:12px 18px;
  display:flex;
  align-items:center;
  gap:16px;
}
.brand-logo{
  flex:0 0 auto;
  width:76px;
  height:76px;
  border-radius:18px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
  overflow:hidden;
}
.brand-logo img{width:68px;height:68px;object-fit:contain;display:block}
.brand-copy{min-width:0}
.brand-kicker{
  font-size:12px;
  font-weight:700;
  letter-spacing:.12em;
  color:#c99300;
  margin-bottom:3px;
}
.brand-title{
  font-size:30px;
  line-height:1.05;
  font-weight:800;
  color:#102b55;
}
.brand-subtitle{
  margin-top:6px;
  color:#68727d;
  font-size:14px;
}
@media(max-width:600px){
  .brand-header{padding:10px 14px;gap:12px}
  .brand-logo{width:62px;height:62px;border-radius:15px}
  .brand-logo img{width:56px;height:56px}
  .brand-title{font-size:24px}
  .brand-kicker{font-size:10px}
  .brand-subtitle{font-size:12px;line-height:1.35}
}
</style>

</head>

<div class="wrap">
<div class="card">
<h2>Comença aquí</h2>
</p>
<label>Categoria<br><select id="cat"></select></label>
<br><br>
<label>Parella<br><select id="pair"></select></label>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxJiP_hg3jNadvGPaMCZ3uTohaDnwn1ps-iWlXWZE5FbWmbZLweE9Z3719u3sfy8JZeAw/exec';
const MONTH = '2026-10';
const MONTH_LABEL = 'octubre de 2026';
const CACHE_KEY = 'lliga_disponibilitat_cache_2026_10';

let DATA = {
  month: MONTH,
  parelles: [],
  partits: [],
  disponibilitat: []
};

let selectedPair = '';
let availabilityState = {};

const catEl = document.getElementById('cat');
const pairEl = document.getElementById('pair');
const avEl = document.getElementById('availability');
const matEl = document.getElementById('matches');

const wk = ['Diumenge','Dilluns','Dimarts','Dimecres','Dijous','Divendres','Dissabte'];

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function pad(n) {
  return String(n).padStart(2, '0');
}

function isoDate(year, monthIndex, day) {
  return `${year}-${pad(monthIndex + 1)}-${pad(day)}`;
}

function days() {
  const arr = [];
  for (let d = 1; d <= 31; d++) {
    const dt = new Date(2026, 9, d);
    // Diumenges: no es mostren.
    if (dt.getDay() !== 0) arr.push(dt);
  }
  return arr;
}

function options(dt) {
  if (dt.getDay() === 6) {
    return [
      'NO',
      '09:00','10:00','11:00','12:00','13:00',
      '16:00','17:00','18:00','19:00','20:00',
      'OTHER'
    ];
  }

  return [
    'NO',
    '09:00-11:00',
    '18:00',
    '19:00',
    '20:00',
    'OTHER'
  ];
}

function label(x) {
  if (x === 'NO') return 'No puc';
  if (x === 'OTHER') return 'Una altra hora';
  return x;
}

function getCategoryPairs(category) {
  return DATA.parelles.filter(p => p.category === category);
}

function getCategoryMatches(category) {
  return DATA.partits.filter(m => m.category === category);
}

function getCategoryNames() {
  return [...new Set(DATA.parelles.map(p => p.category))];
}

function availabilityMapFromServer() {
  const map = {};

  (DATA.disponibilitat || []).forEach(item => {
    if (!item.pairId || !item.date || !item.date.startsWith(MONTH)) return;

    map[item.pairId] ||= {};
    map[item.pairId][item.date] = {
      slot: item.slot || '',
      otherHour: item.otherHour || ''
    };
  });

  return map;
}

function renderCategories() {
  catEl.innerHTML = '';

  getCategoryNames().forEach(category => {
    const o = document.createElement('option');
    o.value = category;
    o.textContent = category;
    catEl.appendChild(o);
  });

  if (!catEl.value && catEl.options.length) {
    catEl.value = catEl.options[0].value;
  }
}

function populatePairs(keepPair = '') {
  const category = catEl.value;
  const pairs = getCategoryPairs(category);

  pairEl.innerHTML = '';

  pairs.forEach(p => {
    const o = document.createElement('option');
    o.value = p.id;
    o.textContent = p.name;
    pairEl.appendChild(o);
  });

  if (pairs.some(p => p.id === keepPair)) {
    pairEl.value = keepPair;
  }

  selectedPair = pairEl.value || '';
  render();
}

function render() {
  if (!selectedPair) {
    avEl.classList.add('hidden');
    matEl.classList.add('hidden');
    return;
  }

  avEl.classList.remove('hidden');

  const state = availabilityState[selectedPair] || {};

  avEl.innerHTML = `
    <h2>📝 La vostra disponibilitat</h2>
    <p class="small">
      Marqueu només els dies i hores en què podeu jugar.
      Si un dia encara no ho sabeu, deixeu-lo sense marcar.
      Podeu modificar-ho més endavant.
    </p>
    <p class="small"><b>${MONTH_LABEL}</b> · Els diumenges no apareixen perquè els gestioneu directament entre vosaltres.</p>
    <div id="daysContainer"></div>
    <div style="margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <button id="saveBtn">💾 Guardar disponibilitat</button>
      <span id="saveStatus" class="small"></span>
    </div>
  `;

  const container = document.getElementById('daysContainer');

  days().forEach(dt => {
    const iso = isoDate(2026, 9, dt.getDate());
    const saved = state[iso] || {};
    const div = document.createElement('div');
    div.className = 'day';

    div.innerHTML = `
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap">
        <b>${wk[dt.getDay()]} ${dt.getDate()} d’octubre</b>
        ${saved.slot ? '<button type="button" class="clearDay" style="font-size:13px;padding:6px 9px">Netejar</button>' : ''}
      </div>
      <div class="opts"></div>
    `;

    const opts = div.querySelector('.opts');
    const current = saved.slot || '';

    options(dt).forEach(x => {
      const lab = document.createElement('label');
      const checked = current === x ? 'checked' : '';

      lab.innerHTML = `
        <input type="radio" name="day-${iso}" value="${x}" ${checked}>
        ${label(x)}
      `;

      lab.querySelector('input').addEventListener('change', () => {
        availabilityState[selectedPair] ||= {};
        availabilityState[selectedPair][iso] = {
          slot: x,
          otherHour: x === 'OTHER' ? (saved.otherHour || '') : ''
        };
        render();
      });

      opts.appendChild(lab);
    });

    if (current === 'OTHER') {
      const wrap = document.createElement('div');
      wrap.style.marginTop = '9px';

      wrap.innerHTML = `
        <input
          type="text"
          class="otherHour"
          value="${escapeHtml(saved.otherHour || '')}"
          placeholder="Escriu l’hora (ex. 18:30)"
          style="width:100%;max-width:240px;box-sizing:border-box"
        >
      `;

      const inp = wrap.querySelector('input');

      inp.addEventListener('input', () => {
        availabilityState[selectedPair][iso].otherHour = inp.value;
      });

      div.appendChild(wrap);
    }

    const clear = div.querySelector('.clearDay');
    if (clear) {
      clear.addEventListener('click', () => {
        delete availabilityState[selectedPair][iso];
        render();
      });
    }

    container.appendChild(div);
  });

  document.getElementById('saveBtn').addEventListener('click', saveAvailability);
  renderMatches();
}

function pendingMatches(category, pairId) {
  return getCategoryMatches(category).filter(
    m => m.status === 'Pendent' && (m.pairAId === pairId || m.pairBId === pairId)
  );
}

function getAvailability(pairId, iso) {
  const v = availabilityState[pairId]?.[iso];
  if (!v || !v.slot || v.slot === 'NO') return null;

  if (v.slot === 'OTHER') {
    return parseTime(v.otherHour);
  }

  if (v.slot === '09:00-11:00') {
    return { type: 'range', min: 9 * 60, max: 11 * 60, label: '09:00–11:00' };
  }

  const minutes = parseTime(v.slot);
  return minutes == null ? null : {
    type: 'from',
    min: minutes,
    label: v.slot
  };
}

function parseTime(value) {
  if (!value) return null;

  const cleaned = String(value).trim().replace('.', ':');
  const match = cleaned.match(/^(\d{1,2}):(\d{2})$/);

  if (!match) return null;

  const h = Number(match[1]);
  const m = Number(match[2]);

  if (h > 23 || m > 59) return null;

  return h * 60 + m;
}

function coincide(a, b) {
  if (!a || !b) return null;

  // Dues disponibilitats "a partir de" coincideixen a partir de l'hora més tardana.
  if (a.type === 'from' && b.type === 'from') {
    const h = Math.max(a.min, b.min);
    return formatMinutes(h);
  }

  // Una franja 09:00–11:00 amb una hora concreta / a partir de.
  if (a.type === 'range' && b.type === 'from') {
    if (b.min > a.max) return null;
    return formatMinutes(Math.max(a.min, b.min));
  }

  if (a.type === 'from' && b.type === 'range') {
    if (a.min > b.max) return null;
    return formatMinutes(Math.max(a.min, b.min));
  }

  // Dues franges 09:00–11:00.
  if (a.type === 'range' && b.type === 'range') {
    return '09:00–11:00';
  }

  return null;
}

function formatMinutes(minutes) {
  return `${pad(Math.floor(minutes / 60))}:${pad(minutes % 60)}`;
}

function renderMatches() {
  if (!selectedPair) return;

  const category = catEl.value;
  const pairs = Object.fromEntries(
    getCategoryPairs(category).map(p => [p.id, p.name])
  );

  matEl.classList.remove('hidden');
  matEl.innerHTML = '<h2>🔎 Coincidències dels partits pendents</h2>';

  const matches = pendingMatches(category, selectedPair);

  if (!matches.length) {
    matEl.innerHTML += '<p>🎉 No hi ha partits pendents.</p>';
    return;
  }

  matches.forEach(match => {
    const opponent =
      match.pairAId === selectedPair ? match.pairBId : match.pairAId;

    const box = document.createElement('div');
    box.className = 'match';

    const rows = [];

    days().forEach(dt => {
      const iso = isoDate(2026, 9, dt.getDate());

      const mine = getAvailability(selectedPair, iso);
      const theirs = getAvailability(opponent, iso);

      const coincidence = coincide(mine, theirs);

      if (coincidence) {
        rows.push(
          `${wk[dt.getDay()]} ${dt.getDate()} d’octubre — <b>${coincidence}</b>`
        );
      }
    });

    box.innerHTML = `
      <b>🆚 ${escapeHtml(pairs[opponent] || opponent)}</b>
      ${
        rows.length
          ? `<p class="ok">🟢 ${rows.length} coincidència/es</p>
             <ul>${rows.map(x => `<li>${x}</li>`).join('')}</ul>`
          : '<p class="none">🔴 Encara no hi ha coincidències.</p>'
      }
    `;

    matEl.appendChild(box);
  });
}

function saveAvailability() {
  const pair = DATA.parelles.find(p => p.id === selectedPair);
  if (!pair) return;

  const status = document.getElementById('saveStatus');
  status.textContent = 'Guardant…';

  const items = Object.entries(availabilityState[selectedPair] || {})
    .filter(([date, value]) => date.startsWith(MONTH) && value && value.slot)
    .map(([date, value]) => ({
      data: date,
      dia: wk[new Date(`${date}T12:00:00`).getDay()],
      franja: value.slot,
      hora_altra: value.slot === 'OTHER' ? (value.otherHour || '') : ''
    }));

  const payload = {
    action: 'sync_month',
    id_parella: pair.id,
    parella: pair.name,
    month: MONTH,
    items
  };

  /*
   * Form POST a un iframe:
   * evita problemes de CORS perquè no necessitem llegir la resposta.
   */
  const iframeName = 'saveFrame_' + Date.now();

  const iframe = document.createElement('iframe');
  iframe.name = iframeName;
  iframe.style.display = 'none';
  document.body.appendChild(iframe);

  const form = document.createElement('form');
  form.method = 'POST';
  form.action = API_URL;
  form.target = iframeName;
  form.style.display = 'none';

  const input = document.createElement('input');
  input.type = 'hidden';
  input.name = 'payload';
  input.value = JSON.stringify(payload);

  form.appendChild(input);
  document.body.appendChild(form);
  form.submit();

  setTimeout(() => {
    form.remove();
    iframe.remove();

    // Actualitzem la disponibilitat localment: no cal tornar a descarregar
    // tots els partits i totes les disponibilitats de la Lliga.
    DATA.disponibilitat = DATA.disponibilitat.filter(x => x.pairId !== pair.id || !String(x.date || '').startsWith(MONTH));
    items.forEach(item => {
      DATA.disponibilitat.push({
        pairId: pair.id,
        pair: pair.name,
        date: item.data,
        day: item.dia,
        slot: item.franja,
        otherHour: item.hora_altra || ''
      });
    });
    availabilityState = availabilityMapFromServer();
    render();
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({ savedAt: Date.now(), data: DATA }));
    } catch (e) {}
    status.textContent = '✓ Disponibilitat actualitzada';
  }, 1200);
}

function loadData(callback, attempt = 1) {
  const maxAttempts = 3;
  const callbackName = '__lligaApiCallback_' + Date.now() + '_' + attempt;
  let finished = false;
  let timeoutId = null;

  function cleanup(script) {
    if (timeoutId) clearTimeout(timeoutId);
    delete window[callbackName];
    if (script && script.parentNode) script.remove();
  }

  function retryOrFail(message) {
    if (finished) return;
    finished = true;
    const script = document.getElementById(callbackName);
    cleanup(script);

    if (attempt < maxAttempts) {
      setTimeout(() => loadData(callback, attempt + 1), 700);
    } else if (!DATA.parelles.length) {
      showError(message || 'No s’ha pogut carregar la resposta de la API de la Lliga.');
    }
  }

  function success(data, script) {
    if (finished) return;
    finished = true;

    try {
      if (!data || !data.ok) {
        throw new Error(data?.error || 'La API no ha retornat dades correctes.');
      }

      DATA.parelles = data.parelles || [];
      DATA.partits = data.partits || [];
      DATA.disponibilitat = data.disponibilitat || [];

      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({ savedAt: Date.now(), data: DATA }));
      } catch (e) {}

      availabilityState = availabilityMapFromServer();
      renderCategories();
      populatePairs(selectedPair);
      render();

      if (typeof callback === 'function') callback();
    } catch (error) {
      retryOrFail(error.message);
      return;
    }

    cleanup(script);
  }

  window[callbackName] = function(data) {
    success(data, document.getElementById(callbackName));
  };

  const script = document.createElement('script');
  script.id = callbackName;
  script.async = true;
  script.src = `${API_URL}?callback=${callbackName}`;

  script.onerror = () => {
    retryOrFail('No s’ha pogut carregar la resposta de la API de la Lliga.');
  };

  timeoutId = setTimeout(() => {
    retryOrFail('La API està trigant massa a respondre.');
  }, 7000);

  document.body.appendChild(script);
}

function showError(message) {
  avEl.classList.remove('hidden');
  avEl.innerHTML = `
    <h2>⚠️ Connexió</h2>
    <p class="none">${escapeHtml(message)}</p>
    <p class="small">Comprova que la Web App d’Apps Script està publicada i accessible.</p>
  `;
  matEl.classList.add('hidden');
}

catEl.addEventListener('change', () => {
  selectedPair = '';
  populatePairs();
});

pairEl.addEventListener('change', () => {
  selectedPair = pairEl.value;
  render();
});

avEl.addEventListener('change', () => {
  renderMatches();
});

// Estat inicial: si tenim una còpia local, la mostrem immediatament
// i després la refresquem en segon pla des de Google Sheets.
catEl.innerHTML = '<option>Carregant…</option>';
pairEl.innerHTML = '<option>Carregant…</option>';

let usedCache = false;
try {
  const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
  if (cached && cached.data && Array.isArray(cached.data.parelles) && cached.data.parelles.length) {
    DATA = cached.data;
    availabilityState = availabilityMapFromServer();
    renderCategories();
    populatePairs();
    render();
    usedCache = true;
  }
} catch (e) {}

// Sempre refresquem en segon pla per tenir dades actualitzades.
loadData();
</script>
</body></html>
